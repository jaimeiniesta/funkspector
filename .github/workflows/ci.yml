name: CI

on:
  push:
  pull_request:

jobs:
  lint:
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v4

        - uses: erlef/setup-beam@v1
          with:
            otp-version: 27.x
            elixir-version: 1.18

        - run: mix deps.get
        - run: mix deps.unlock --check-unused
        - run: mix deps.compile
        - run: mix compile --warnings-as-errors
        - run: mix format --check-formatted
        # The OTP < 27 test jobs use mix.legacy.lock; keep it free of unused entries too.
        - run: cp mix.legacy.lock mix.lock && mix deps.get && mix deps.unlock --check-unused

  test:
    name: Test the app
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        elixir: ["1.18", "1.17"]
        otp: ["27", "26", "25", "24"]
        exclude:
          - elixir: "1.18"
            otp: "24"
          - elixir: "1.17"
            otp: "24"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock', 'mix.legacy.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      # hackney 4 pulls in quic, which needs OTP 27+. Below 27, test the other
      # supported pair (httpoison 2.3 / hackney 1.21) from mix.legacy.lock.
      - if: matrix.otp != '27'
        run: cp mix.legacy.lock mix.lock

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile
      - run: mix test.adapters